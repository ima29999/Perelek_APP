name: aruskas_rt
description: Sistem Manajemen Warga & Keuangan RT - ARUSKAS RT

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.5.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP & API
  dio: ^5.4.0

  # State Management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^13.2.0

  # UI Components
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2

  # File & Image
  image_picker: ^1.1.2
  photo_view: ^0.15.0

  # Payment Gateway (Midtrans Snap)
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.0

  # Utils
  intl: ^0.20.2

  cupertino_icons: ^1.0.6
  curved_navigation_bar: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fluid_splash/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fluid_splash/fonts/DMSerifDisplay-Regular.ttf
    - family: MarcellusSC
      fonts:
        - asset: assets/fluid_splash/fonts/MarcellusSC-Regular.ttf
    - family: Lexend
      fonts:
        - asset: assets/fluid_splash/fonts/Lexend-Regular.ttf
